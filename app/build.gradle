plugins { id 'com.android.application' }

android {
    namespace 'com.wajid.videoplayer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.wajid.videoplayer.mxstyle'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 2)
        versionName '1.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('SIGNING_KEYSTORE_PATH')
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
}
